<!DOCTYPE html>
<html>
<head>
    <title>Air Quality Map</title>
    <!--place reserved for script insertion at line 6 : two consts are inserted: 1. REQUEST_24HRS_URL 2. REQUEST_ARCHIVE_URL -->
<script>const REQUEST_24HRS_URL = "https://b95oaxxipi.execute-api.us-east-1.amazonaws.com/dev/request_24hrs"; const REQUEST_ARCHIVE_URL = "https://b95oaxxipi.execute-api.us-east-1.amazonaws.com/dev/request_archive";</script>
     <!-- css of map-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <!-- js of map-->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="">
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <style>
        html, body, #main, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #main {
            position: relative;
        }
        #overlay-right {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000; 
            height:80vh;
            width:20vw;
        }
        #overlay-left {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000; 
            height:50vh;
            width:30vw;
        }
        form label{
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        form input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 5px;
            border: none;
        }
        .date-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
        }
        .start-date-span, .end-date-span {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .date-input {
            border-radius: 10px;
            outline: 2px solid #0077fe;
            border: 0;
            background-color: #e2e2e2;
            padding: 10px 1rem;
            transition: 0.25s;
        }
        .date-input:focus {
            outline: 2px solid #0400fe;
            background-color: #fff
        }
        .submit-button, #export-daily{
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #0077fe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: 0.25s;
        }
        .submit-button:hover, #export-daily:hover {
            background-color: #0400fe;
        }
        #data-display {
            max-height: 55vh;
            width: 100%;
            overflow: auto;
            background-color: white;
            color: black;
            border: 1px solid #ccc;
        }
        #data-display table {
            width: 100%;
            border-collapse: collapse;
        }
        #data-display th, #data-display td {
            border: 1px solid #ccc;
            
            text-align: left;
        }
        #data-display th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        #loading-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent black background */
            z-index: 9999; /* High z-index to sit on top of map */
            justify-content: center;
            align-items: center;
        }

        .spinner-box {
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0077fe; /* Blue to match your theme */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="loading-overlay">
            <div class="spinner-box">
                <div class="spinner"></div>
                <h3>Processing Archive...</h3>
                <p>Please wait, this may take a moment.</p>
            </div>
        </div>
        <div id="map"></div> <!-- insert map here-->
        <!-- overlay-left form (over the map)-->
        <div id="overlay-left"> 
            <!-- form for simplicity for submission-->
            <!-- When the form is submitted, it sends a POST request to the specified API Gateway endpoint -->
                <!--Four inputs : latitude(string), longitude(string), start date(string), end date(string) -->
            <!-- Replace the action URL with your actual API Gateway endpoint -->
            <form>
                <h1>Co-ordinate selected:</h1>
                <label for="lat">Latitude:</label>
                <input class="date-input" type="text" id="lat" name="lat" readonly>
                <label for="lon">Longitude:</label>
                <input class="date-input" type="text" id="lon" name="lon" readonly>
                <h1>Select time:</h1>
                <div class="date-container">
                    <span class="start-date-span">
                        <label for="date0">Start Date:</label>
                        <input class="date-input" type="date" id="date0" name="date0" min="2015-10-01">
                    </span>
                    <span class="end-date-span">
                        <label for="date1">End Date:</label>
                        <input class="date-input" type="date" id="date1" name="date1" min="2015-10-01">
                    </span>
                </div>
                <input class="submit-button" type="submit" value="Export">
            </form>
        </div>
        <div id="overlay-right">
            <h2>Selected location 24hrs readings:</h2>
            <div id="data-display">
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>PM2.5</th>
                            <th>PM10</th>
                            <th>Sensor</th>
                        </tr>
                    </thead>
                    <tbody id="data-body">
                        <!-- Data rows will be inserted here -->
                    </tbody>   
                </table>
            </div>
            <button id="export-daily">Export 24hrs Data</button>
        </div>
        
    </div>
     

    </body>
    <script>
        let currentData = null;
        let currentLat = 0;
        let currentLon = 0;
        // Initialize the map
        var map = L.map('map',{preferCanvas: true
                                }).setView([51.505, -0.09], 13);
        map.zoomControl.setPosition('bottomright');                            
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        // Load locations from JSON and add markers
        var selectedMarker = null;
        fetch('./locations.json')
        .then(response => response.json()) // Convert response to JSON
        .then(locs => { 
            var markers = L.markerClusterGroup();
            locs.forEach(function(loc) {
                if (loc.lat && loc.lon) {
                    var marker = L.marker([loc.lat, loc.lon]);
                    marker.bindPopup(`(${loc.lat}, ${loc.lon})`);
                    markers.addLayer(marker);
                }
            });
            markers.on('click', function(e) {
                var lat = e.layer.getLatLng().lat;
                var lon = e.layer.getLatLng().lng;
                document.getElementById('lat').value = lat;
                document.getElementById('lon').value = lon;
                // Add codes for fetching and displaying 24hrs data here
                fetch(`${REQUEST_24HRS_URL}?lat=${lat}&lon=${lon}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Network response was not ok " + response.statusText);
                    }
                    return response.json();})
                .then(data => {
                    //console.log("Received data:", data);
                    currentData = data;
                    currentLat = lat;
                    currentLon = lon;
                    const dataBody = document.getElementById('data-body');
                    dataBody.innerHTML = ''; 
                    data.forEach(entry => {
                        const row = document.createElement('tr');
                        const timestampCell = document.createElement('td');
                        timestampCell.textContent = entry.timestamp;
                        const pm25Cell = document.createElement('td');
                        pm25Cell.textContent = entry.PM2_5;
                        const pm10Cell = document.createElement('td');
                        pm10Cell.textContent = entry.PM10;
                        const sensorCell = document.createElement('td');
                        sensorCell.textContent = entry.type;
                        row.appendChild(timestampCell);
                        row.appendChild(pm25Cell);
                        row.appendChild(pm10Cell);
                        row.appendChild(sensorCell);
                        dataBody.appendChild(row);
                    });
                }).catch(error => console.error("Error fetching 24hrs data:", error));
            });
            map.addLayer(markers);
        }).catch(error => console.error("Error loading JSON:", error));
        // Clear lat/lon inputs when clicking on the map (not on a marker)
        //map.on('click', function(e) {
        //    document.getElementById('lat').value = '';
        //   document.getElementById('lon').value = '';
        //});

        document.getElementById('export-daily').addEventListener('click', function() {
            if (!currentData || currentData.length === 0) {
                alert('No 24hrs data available to export. Please select a location on the map.');
                return;
            }
            const csvRows = [];
            // Add headers
            csvRows.push(['Timestamp', 'PM2.5', 'PM10', 'Sensor'].join(','));
            // Add data rows
            currentData.forEach(entry => {
                const row = [
                    entry.timestamp,
                    entry.PM2_5,
                    entry.PM10,
                    entry.type
                ];
                csvRows.push(row.join(','));
            });
            const csvContent = csvRows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            const filename = `24hrs_data_lat${currentLat}_lon${currentLon}.csv`;
            a.setAttribute('download', filename);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
    <script>
        // Add data check before form submission
        const form = document.querySelector('form');
        const loadingOverlay = document.getElementById('loading-overlay');
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const latitude = document.getElementById('lat').value;
            const longitude = document.getElementById('lon').value;
            if (!latitude || !longitude) {
                alert('Please select a location on the map.');
                return;
            }
            const startDate = document.getElementById('date0').value;
            const endDate = document.getElementById('date1').value;
            if (!startDate || !endDate) {
                alert('Please select both start and end dates.');
                event.preventDefault();
                return;
            }
            if (startDate > endDate) {
                alert('Start date must be before end date.');
                event.preventDefault();
                return;
            }
            loadingOverlay.style.display = 'flex';
            fetch(`${REQUEST_ARCHIVE_URL}?lat=${latitude}&lon=${longitude}&date0=${startDate}&date1=${endDate}`)
            .then(response => {
                if (response.status === 204) {
                    throw new Error("No data found" + response.body);

                }

                if (!response.ok) {
                    throw new Error("Network response was not ok " + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                const s3Url = data.download_url;
                return fetch(s3Url);
            })
            .then(res => res.blob())
            .then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('hidden', '');
                a.setAttribute('href', url);
                const filename = `archive_data_lat${latitude}_lon${longitude}_from${startDate}_to${endDate}.csv`;
                a.setAttribute('download', filename);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            })
            .catch(error => {
                alert('Failed to download archive data: ' + error.message);
            })
            .finally(() => {
                loadingOverlay.style.display = 'none';
            });
        });
    </script>
</html>
