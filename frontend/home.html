<!DOCTYPE html>
<html>
  <head>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <title>Air Quality Map</title>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <style>
        html, body, #main, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #main {
            position: relative;
        }
        #overlay-right {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000; 
            height:80vh;
            width:20vw;
        }

        #overlay-left {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000; 
            height:50vh;
            width:30vw;
        }
        form label{
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        form input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 5px;
            border: none;
        }
        .date-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
        }
        .start-date-span, .end-date-span {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .date-input {
            border-radius: 10px;
            outline: 2px solid #0077fe;
            border: 0;
            background-color: #e2e2e2;
            padding: 10px 1rem;
            transition: 0.25s;
        }

        .date-input:focus {
            outline: 2px solid #0400fe;
            background-color: #fff
        }
        .submit-button, #export-daily{
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #0077fe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: 0.25s;
        }
        .submit-button:hover, #export-daily:hover {
            background-color: #0400fe;
        }

    </style>
    
  </head>
  <body>
    <div id="main">
        <div id="map"></div> <!-- insert map here-->
        <!-- overlay-left form (over the map)-->
        <div id="overlay-left"> 
            <!-- form for simplicity for submission-->
            <!-- When the form is submitted, it sends a POST request to the specified API Gateway endpoint -->
                <!--Four inputs : latitude(string), longitude(string), start date(string), end date(string) -->
            <!-- Replace the action URL with your actual API Gateway endpoint -->
            <form action="https://abcd1234.execute-api.us-east-1.amazonaws.com/prod/myresource" method="post">
                <h1>Co-ordinate selected:</h1>
                <label for="lat">Latitude:</label>
                <input class="date-input" type="text" id="lat" name="lat" readonly>
                <label for="lon">Longitude:</label>
                <input class="date-input" type="text" id="lon" name="lon" readonly>
                <h1>Select time:</h1>
                <div class="date-container">
                    <span class="start-date-span">
                        <label for="date0">Start Date:</label>
                        <input class="date-input" type="date" id="date0" name="date0" min="2015-10-01">
                    </span>
                    <span class="end-date-span">
                        <label for="date1">End Date:</label>
                        <input class="date-input" type="date" id="date1" name="date1" min="2015-10-01">
                    </span>
                </div>
                <input class="submit-button" type="submit" value="Export">
            </form>
        </div>
        <div id="overlay-right">
            <h2>Selected location 24hrs readings:</h2>
            <div id="data-display">
                <!-- Data will be displayed here -->
            </div>
            <button id="export-daily">Export 24hrs Data</button>
        </div>
        
    </div>
     


  </body>
  <script>
    // Initialize the map
        var map = L.map('map',{preferCanvas: true
                                }).setView([51.505, -0.09], 13);
        map.zoomControl.setPosition('bottomright');                            
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
    </script>
    <script>
    // Add data check before form submission
        const form = document.querySelector('form');
        form.addEventListener('submit', function(event) {
            const latInput = document.getElementById('lat');
            const lonInput = document.getElementById('lon');
            if (!latInput.value || !lonInput.value) {
                alert('Please select a location on the map.');
                event.preventDefault();
                return;
            }
            const startDate = document.getElementById('date0').value;
            const endDate = document.getElementById('date1').value;
            if (!startDate || !endDate) {
                alert('Please select both start and end dates.');
                event.preventDefault();
                return;
            }
            if (startDate > endDate) {
                alert('Start date must be before end date.');
                event.preventDefault();
                return;
            }
        });
    </script>
</html>
